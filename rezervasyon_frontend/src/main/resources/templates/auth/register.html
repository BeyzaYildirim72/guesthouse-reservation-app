<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/header :: head('Üye Ol')}"></th:block>
  <style>
    .register-card {
      background: var(--white);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--gray-200);
      max-width: 680px;
      width: 100%;
    }

    .register-card-header {
      background: var(--ogm-900);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .register-card-body { padding: 1.75rem 2rem; }

    .password-strength { margin-top: 4px; height: 4px; border-radius: 2px; background: var(--gray-200); overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }

    .strength-text { font-size: .7rem; margin-top: 3px; }
  </style>
</head>

<body class="auth-body">

  <!-- Üst Navigasyon -->
  <div th:replace="~{fragments/header :: auth-navbar}"></div>

  <!-- Ana İçerik -->
  <main class="auth-main" role="main" id="main-content"
        style="padding: 2rem 1rem;">
    <div class="register-card">

      <!-- Başlık -->
      <div class="register-card-header">
        <span class="ogm-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="29" fill="#0f2815"/>
            <circle cx="30" cy="30" r="26" fill="none" stroke="#4a9454" stroke-width="1.5"/>
            <polygon points="30,10 22,24 26,24 19,36 24,36 20,47 40,47 36,36 41,36 34,24 38,24" fill="#5ab469"/>
            <rect x="27" y="46" width="6" height="5" rx="1" fill="#7a5c2a"/>
          </svg>
        </span>
        <div>
          <div style="font-size:.7rem;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.55);text-transform:uppercase;">
            Orman Genel Müdürlüğü
          </div>
          <div style="font-size:1.1rem;font-weight:700;color:#fff;">Yeni Üyelik Kaydı</div>
          <div style="font-size:.75rem;color:rgba(255,255,255,.55);margin-top:2px;">
            Tüm alanları eksiksiz doldurunuz.
          </div>
        </div>
      </div>

      <!-- Form Gövdesi -->
      <div class="register-card-body">
        <form id="registerForm" novalidate autocomplete="off">

          <!-- Kişisel Bilgiler -->
          <div style="margin-bottom:1.25rem;">
            <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);margin-bottom:.85rem;padding-bottom:.5rem;border-bottom:1px solid var(--gray-200);">
              <i class="bi bi-person"></i> Kişisel Bilgiler
            </div>
            <div class="form-grid-2">

              <div class="form-group">
                <label class="ogm-label" for="regAd">
                  <span class="req">*</span> Ad
                </label>
                <input id="regAd" type="text"
                       class="ogm-input-light validate-live"
                       data-error="adError"
                       placeholder="Adınız"
                       aria-required="true"/>
                <div id="adError" class="field-error" role="alert"></div>
              </div>

              <div class="form-group">
                <label class="ogm-label" for="regSoyad">
                  <span class="req">*</span> Soyad
                </label>
                <input id="regSoyad" type="text"
                       class="ogm-input-light validate-live"
                       data-error="soyadError"
                       placeholder="Soyadınız"
                       aria-required="true"/>
                <div id="soyadError" class="field-error" role="alert"></div>
              </div>

              <div class="form-group">
                <label class="ogm-label" for="regTc">
                  <span class="req">*</span> T.C. Kimlik No
                </label>
                <input id="regTc" type="text"
                       class="ogm-input-light validate-live"
                       data-error="tcError"
                       placeholder="11 haneli TC Kimlik No"
                       maxlength="11"
                       inputmode="numeric"
                       aria-required="true"/>
                <div id="tcError" class="field-error" role="alert"></div>
              </div>

              <div class="form-group">
                <label class="ogm-label" for="regSicil">
                  <span class="req">*</span> Kurum Sicil No
                </label>
                <input id="regSicil" type="text"
                       class="ogm-input-light validate-live"
                       data-error="sicilError"
                       placeholder="OGM Sicil Numaranız"
                       aria-required="true"/>
                <div id="sicilError" class="field-error" role="alert"></div>
              </div>

            </div>
          </div>

          <!-- İletişim Bilgileri -->
          <div style="margin-bottom:1.25rem;">
            <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);margin-bottom:.85rem;padding-bottom:.5rem;border-bottom:1px solid var(--gray-200);">
              <i class="bi bi-envelope"></i> İletişim Bilgileri
            </div>
            <div class="form-grid-2">

              <div class="form-group">
                <label class="ogm-label" for="regEposta">
                  <span class="req">*</span> E-posta
                </label>
                <input id="regEposta" type="email"
                       class="ogm-input-light validate-live"
                       data-error="epostaError"
                       placeholder="ornek@ogm.gov.tr"
                       autocomplete="email"
                       aria-required="true"/>
                <div id="epostaError" class="field-error" role="alert"></div>
              </div>

              <div class="form-group">
                <label class="ogm-label" for="regTelefon">
                  <span class="req">*</span> Telefon
                </label>
                <input id="regTelefon" type="tel"
                       class="ogm-input-light validate-live"
                       data-error="telefonError"
                       placeholder="05XX XXX XX XX"
                       autocomplete="tel"
                       aria-required="true"/>
                <div id="telefonError" class="field-error" role="alert"></div>
              </div>

            </div>
          </div>

          <!-- Şifre Bilgileri -->
          <div style="margin-bottom:1.25rem;">
            <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);margin-bottom:.85rem;padding-bottom:.5rem;border-bottom:1px solid var(--gray-200);">
              <i class="bi bi-lock"></i> Şifre Bilgileri
            </div>
            <div class="form-grid-2">

              <div class="form-group">
                <label class="ogm-label" for="regSifre">
                  <span class="req">*</span> Şifre
                </label>
                <div style="position:relative;">
                  <input id="regSifre" type="password"
                         class="ogm-input-light validate-live"
                         data-error="sifreError"
                         placeholder="En az 8 karakter"
                         autocomplete="new-password"
                         aria-required="true"
                         oninput="checkStrength(this.value)"
                         style="padding-right:2.5rem;"/>
                  <button type="button"
                          style="position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:.9rem;"
                          onclick="togglePassword('regSifre',this)"
                          aria-label="Şifreyi Göster/Gizle">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="password-strength" aria-hidden="true">
                  <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div id="strengthText" class="strength-text"></div>
                <div id="sifreError" class="field-error" role="alert"></div>
              </div>

              <div class="form-group">
                <label class="ogm-label" for="regSifreTekrar">
                  <span class="req">*</span> Şifre Tekrar
                </label>
                <div style="position:relative;">
                  <input id="regSifreTekrar" type="password"
                         class="ogm-input-light"
                         placeholder="Şifrenizi tekrar giriniz"
                         autocomplete="new-password"
                         aria-required="true"
                         style="padding-right:2.5rem;"/>
                  <button type="button"
                          style="position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:.9rem;"
                          onclick="togglePassword('regSifreTekrar',this)"
                          aria-label="Şifreyi Göster/Gizle">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div id="sifreTekrarError" class="field-error" role="alert"></div>
              </div>

            </div>
          </div>

          <!-- KVKK Onay -->
          <div style="margin-bottom:1.25rem;">
            <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
              <input type="checkbox" id="kvkk"
                     style="width:16px;height:16px;margin-top:2px;accent-color:var(--ogm-700);flex-shrink:0;"/>
              <span style="font-size:.8rem;color:var(--gray-600);line-height:1.5;">
                <a href="/kvkk" target="_blank" style="color:var(--ogm-600);font-weight:600;">
                  Kişisel Verilerin Korunması Aydınlatma Metni
                </a>'ni okudum, anladım ve kabul ediyorum.
              </span>
            </label>
            <div id="kvkkError" class="field-error" role="alert"></div>
          </div>

          <!-- Butonlar -->
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;">
            <a href="/giris"
               style="font-size:.82rem;color:var(--ogm-600);font-weight:600;">
              ← Giriş sayfasına dön
            </a>
            <button type="submit" class="btn-ogm btn-ogm-primary" style="min-width:170px;">
              <i class="bi bi-person-plus-fill"></i>
              Kayıt Oluştur
            </button>
          </div>

        </form>
      </div><!-- /register-card-body -->

    </div><!-- /register-card -->
  </main>

  <!-- Alt Bilgi -->
  <div th:replace="~{fragments/footer :: auth-footer}"></div>

  <!-- JS -->
  <th:block th:replace="~{fragments/header :: scripts}"></th:block>
  <script th:src="@{/js/auth.js}"></script>
  <script>
    function checkStrength(val) {
      const bar  = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');
      if (!bar || !text) return;

      let score = 0;
      if (val.length >= 8)  score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { w: '0%',   bg: 'transparent', label: '',                  color: '' },
        { w: '25%',  bg: '#ef4444',     label: 'Zayıf',             color: '#ef4444' },
        { w: '50%',  bg: '#f59e0b',     label: 'Orta',              color: '#f59e0b' },
        { w: '75%',  bg: '#3b82f6',     label: 'İyi',               color: '#3b82f6' },
        { w: '100%', bg: '#276e31',     label: 'Güçlü ✓',           color: '#276e31' },
      ];

      const l = levels[score] || levels[0];
      bar.style.width      = l.w;
      bar.style.background = l.bg;
      text.textContent     = l.label;
      text.style.color     = l.color;
    }
  </script>
</body>
</html>
