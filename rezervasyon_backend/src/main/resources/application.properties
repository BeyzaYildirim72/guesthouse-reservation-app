spring.application.name=rezervasyon

# JWT secret is loaded from the JWT_SECRET environment variable.
# Set it in your shell, CI/CD pipeline, or a local .env file (see .env.example).
# Minimum 32 characters (256 bits) required for HS256.
# The application will refuse to start if this variable is not set.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

app.frontend.reset-password-url=http://localhost:3000/reset-password


spring.datasource.url=jdbc:postgresql://localhost:5432/rezervasyon_db
spring.datasource.username=postgres
spring.datasource.password=postgres123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
