<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: head('Konaklama Detayları')}"></th:block>
</head>

<body style="background:var(--gray-100);">
<div class="panel-layout">

    <!-- Sol Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar('rezervasyon')}"></div>

    <!-- Sağ İçerik -->
    <div class="panel-content">

        <!-- Üst Bar -->
        <div th:replace="~{fragments/header :: panel-topbar('OGM Misafirhane Rezervasyon Portalı', '1 Üye')}"></div>

        <!-- Ana Sayfa İçeriği -->
        <main class="panel-main" role="main" id="main-content">

            <!-- Sayfa Başlığı -->
            <div class="page-header" style="display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h1 class="page-title">Yeni Rezervasyon Oluştur</h1>
                    <p class="page-subtitle">Bilgilerinizi adım adım doldurunuz</p>
                </div>
                <a href="#" class="btn-ogm btn-ogm-secondary btn-sm">
                    <i class="bi bi-person"></i> Üye Girişi
                </a>
            </div>

            <!-- Form Konteyner -->
            <div class="table-card" style="padding: 2rem;">

                <!-- Adım Göstergeleri (Stepped Bar) -->
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; color: var(--gray-500); font-size: 0.85rem; flex-wrap: wrap; gap: 10px;">
                    <div style="display: flex; align-items: center; gap: 8px; color: var(--ogm-700);">
                        <i class="bi bi-person-lines-fill fs-5"></i> Misafir Bilgileri
                    </div>
                    <div style="flex-grow: 1; height: 1px; background: var(--gray-300); margin: 0 10px;"></div>
                    <div style="display: flex; align-items: center; gap: 8px; color: var(--ogm-700); font-weight: 600;">
                        <i class="bi bi-calendar-event fs-5"></i> Konaklama
                    </div>
                    <div style="flex-grow: 1; height: 1px; background: var(--gray-300); margin: 0 10px;"></div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="bi bi-house-door fs-5"></i> Oda Seçimi
                    </div>
                    <div style="flex-grow: 1; height: 1px; background: var(--gray-300); margin: 0 10px;"></div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="bi bi-eye fs-5"></i> Ön İzleme
                    </div>
                    <div style="flex-grow: 1; height: 1px; background: var(--gray-300); margin: 0 10px;"></div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="bi bi-credit-card fs-5"></i> Ödeme
                    </div>
                </div>

                <!-- Bölüm Başlığı -->
                <div style="margin-bottom: 1.5rem;">
                    <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--gray-900);">Konaklama Detayları</h3>
                    <p style="font-size: 0.82rem; color: var(--gray-500);">Giriş/çıkış tarihlerini ve kişi sayısını belirleyin.</p>
                </div>

                <!-- Form Alanları -->
                <form>
                    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">

                        <!-- Giriş Tarihi -->
                        <div>
                            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px;">
                                <span style="color: #d32f2f;">*</span> Giriş Tarihi
                            </label>
                            <input type="date" required
                                   style="width: 100%; background: #1c4227; color: white; border: none; padding: 0.9rem 1rem; border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; cursor: pointer;">
                        </div>

                        <!-- Çıkış Tarihi -->
                        <div>
                            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px;">
                                <span style="color: #d32f2f;">*</span> Çıkış Tarihi
                            </label>
                            <input type="date" required
                                   style="width: 100%; background: #1c4227; color: white; border: none; padding: 0.9rem 1rem; border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; cursor: pointer;">
                        </div>

                        <!-- Yetişkin Sayısı -->
                        <div>
                            <label class="ogm-label" style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--gray-700);">
                                <span style="color: red;">*</span> Yetişkin Sayısı
                            </label>
                            <input type="text" class="ogm-input" value="1"
                                   style="width: 100%; padding: 0.6rem; border: 1px solid var(--gray-300); border-radius: 6px; background-color: #245332; color: white;">
                        </div>

                        <!-- Çocuk Sayısı -->
                        <div>
                            <label class="ogm-label" style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--gray-700);">
                                Çocuk Sayısı
                            </label>
                            <input type="text" class="ogm-input" value="0"
                                   style="width: 100%; padding: 0.6rem; border: 1px solid var(--gray-300); border-radius: 6px; background-color: #245332; color: white;">
                        </div>

                        <!-- Konaklama Tipi -->
                        <div>
                            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px;">
                                <span style="color: #d32f2f;">*</span> Konaklama Tipi
                            </label>
                            <select name="konaklamaTipi" required style="width: 100%; padding: 0.75rem; background: #1c4227; color: white; border: none; border-radius: 8px; font-size: 0.9rem; outline: none; box-sizing: border-box;">
                                <option value="" disabled selected>Lütfen Seçiniz</option>
                                <option value="STANDART">Standart</option>
                                <option value="VIP">VIP</option>
                            </select>
                        </div>

                        <!-- Özel İstek / Notlar -->
                        <div>
                            <label class="ogm-label" style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--gray-700);">
                                Özel İstek / Notlar
                            </label>
                            <textarea class="ogm-input" placeholder="Ekstra yastık, engelli oda gereksinimi vb." rows="2"
                                      style="width: 100%; padding: 0.4rem; border: 1px solid var(--gray-300); border-radius: 6px; background-color: #245332; color: white;"></textarea>
                        </div>

                    </div>

                    <!-- Geri ve İleri Butonları -->
                    <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
                        <button type="button" class="btn-ogm btn-ogm-secondary" onclick="window.location.href='/dashboard'" style="padding: 0.6rem 1.5rem; border: 1px solid var(--gray-300); border-radius: 6px; background: white; font-weight: 600; cursor: pointer;">
                            ← Geri
                        </button>
                        <button type="button" class="btn-ogm btn-ogm-primary" onclick="window.location.href='/oda-secimi'" style="background-color: #245332; color: white; padding: 0.6rem 1.5rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
                            İleri &nbsp;→
                        </button>
                    </div>

                </form>

            </div><!-- /table-card -->

        </main><!-- /panel-main -->

        <!-- Alt Bilgi -->
        <div th:replace="~{fragments/footer :: panel-footer}"></div>

    </div><!-- /panel-content -->
</div><!-- /panel-layout -->

<th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
