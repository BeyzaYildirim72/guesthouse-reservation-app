<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/header :: head('Ana Sayfa')}"></th:block>
</head>

<body style="background:var(--gray-100);">
<div class="panel-layout">

  <!-- Sol Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

  <!-- Sağ İçerik -->
  <div class="panel-content">

    <!-- Üst Bar -->
    <div th:replace="~{fragments/header :: panel-topbar('OGM Misafirhane Rezervasyon Portalı', '1 Üye')}"></div>

    <!-- Ana Sayfa İçeriği -->
    <main class="panel-main" role="main" id="main-content" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 120px); padding: 2rem;">

      <!-- Hoş Geldiniz Kartı -->
      <div style="background: white; border-radius: 16px; padding: 3rem 4rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); text-align: center; display: flex; flex-direction: column; align-items: center; max-width: 500px; width: 100%;">

        <!-- Yuvarlak Ev İkonu -->
        <div style="width: 70px; height: 70px; background: #245332; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; color: white; font-size: 1.8rem;">
          <i class="bi bi-house-door-fill"></i>
        </div>

        <!-- Başlık ve Açıklama -->
        <h2 style="font-size: 1.4rem; font-weight: 700; color: var(--gray-900); margin-bottom: 0.5rem;">OGM Misafirhane'ye Hoş Geldiniz</h2>
        <p style="font-size: 0.85rem; color: var(--gray-500); margin-bottom: 2rem;">Rezervasyon oluşturmak için aşağıdaki butona tıklayın.</p>

        <!-- Rezervasyon Oluştur Butonu -->
        <button type="button" onclick="window.location.href='/rezervasyon-olustur'" style="background: #245332; color: white; border: none; padding: 0.75rem 1.75rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(36,83,50,0.2);">
          <i class="bi bi-calendar-plus"></i> Rezervasyon Oluştur
        </button>

      </div>

    </main><!-- /panel-main -->

    <!-- Alt Bilgi -->
    <div th:replace="~{fragments/footer :: panel-footer}"></div>

  </div><!-- /panel-content -->
</div><!-- /panel-layout -->

<button type="button" onclick="window.location.href='/konaklama'" style="background: #245332; color: white; border: none; padding: 0.75rem 1.75rem; border-radius: 8px; font-weight: 600; cursor: pointer;">
  İleri →
</button>

<th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
